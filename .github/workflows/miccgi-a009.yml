name: MICCGI A009 fresh successor resume

on:
  push:
    branches:
      - miccgi-resume-a009-66deff7
    paths:
      - .github/workflows/miccgi-a009.yml

permissions:
  contents: write

jobs:
  fresh-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated A009 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resume Gen8 on fresh runner, self-actuate, admit Gen9, publish successor
        shell: bash
        run: |
          set -euo pipefail

          REPO="kengorogoro-design/Spoon-Knife"
          BRANCH="miccgi-resume-a009-66deff7"
          PARENT_A008_SHA256="66deff7b328a483d5cdbe9729ec8a9e742ac83d089f7b61ed7a53efb6b6bdefb"
          A009_NONCE="9a8ed143021fdd10e549cf616f82779324e9be3abcc1f16c23916a59b76a30d9"
          CAPSULE="$GITHUB_WORKSPACE/miccgi/a008-output/MICCGI_REMOTE_SUCCESSOR_CAPSULE_A008.zip"

          test "$(sha256sum "$CAPSULE" | awk '{print $1}')" = "$PARENT_A008_SHA256"

          rm -rf /tmp/a009-capsule /tmp/a009-runtime
          mkdir -p /tmp/a009-capsule
          unzip -q "$CAPSULE" -d /tmp/a009-capsule
          SRC="/tmp/a009-capsule/MICCGI_REMOTE_SUCCESSOR_CAPSULE_A008"
          test -f "$SRC/pyproject.toml"
          test -f "$SRC/runtime_state/current_state.json"

          cp -a "$SRC/runtime_state" /tmp/a009-runtime
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/a009-runtime/current_state.json'))
          assert s['generation']==8, s
          assert s['micgi']=='UNPROVEN'
          assert s['economic_t0']=='NOT_OBSERVED'
          assert s['verified_realized_profit']=='NOT_PROVEN'
          assert 'external.runtime.github_actions.remote_self_publication' in s['claims']
          print('MICCGI_A009_FRESH_RESTORE_GEN8=PASS')
          PY

          cd "$SRC"
          python3 -m compileall -q micgi tests
          PYTHONPATH="$SRC" python3 -m micgi --state-dir /tmp/a009-runtime status > /tmp/a009-status8-before.json

          cd "$GITHUB_WORKSPACE"
          mkdir -p miccgi/a009-output
          cat > miccgi/a009-output/FRESH_RESUME_PROBE.json <<EOF
          {
            "parent_a008_sha256": "$PARENT_A008_SHA256",
            "branch": "$BRANCH",
            "nonce_sha256": "$A009_NONCE",
            "restored_generation": 8,
            "scope": "fresh-run cross-generation continuity probe; no economic credit"
          }
          EOF
          PROBE_FILE_SHA="$(sha256sum miccgi/a009-output/FRESH_RESUME_PROBE.json | awk '{print $1}')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miccgi/a009-output/FRESH_RESUME_PROBE.json
          git commit -m "MICCGI A009 fresh-resume probe $A009_NONCE"
          PROBE_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH"

          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" --force
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$PROBE_COMMIT"
          git show "refs/remotes/origin/$BRANCH:miccgi/a009-output/FRESH_RESUME_PROBE.json" > /tmp/a009-probe-git.json
          GIT_PROBE_SHA="$(sha256sum /tmp/a009-probe-git.json | awk '{print $1}')"
          test "$GIT_PROBE_SHA" = "$PROBE_FILE_SHA"
          grep -q "$A009_NONCE" /tmp/a009-probe-git.json

          curl -fsSL -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/contents/miccgi/a009-output/FRESH_RESUME_PROBE.json?ref=$PROBE_COMMIT"             > /tmp/a009-probe-rest-meta.json
          python3 - <<'PY'
          import json,base64
          meta=json.load(open('/tmp/a009-probe-rest-meta.json'))
          raw=base64.b64decode(meta['content'])
          open('/tmp/a009-probe-rest.json','wb').write(raw)
          PY
          REST_PROBE_SHA="$(sha256sum /tmp/a009-probe-rest.json | awk '{print $1}')"
          test "$REST_PROBE_SHA" = "$PROBE_FILE_SHA"
          grep -q "$A009_NONCE" /tmp/a009-probe-rest.json

          CANONICAL_OBS_SHA="$(python3 - <<PY
          import json,hashlib
          obj={
            'repository':'$REPO',
            'branch':'$BRANCH',
            'commit_sha':'$PROBE_COMMIT',
            'probe_file_sha256':'$PROBE_FILE_SHA',
            'nonce_sha256':'$A009_NONCE',
            'restored_generation':8,
            'parent_a008_sha256':'$PARENT_A008_SHA256'
          }
          print(hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          )"
          RESOURCE_ID="$REPO@$PROBE_COMMIT:miccgi/a009-output/FRESH_RESUME_PROBE.json"

          mkdir -p /tmp/a009-runtime/external_receipts
          python3 - <<PY
          import json,hashlib
          r={
            'receipt_version':1,
            'capability_id':'external.runtime.github_actions.fresh_successor_resume',
            'provider':'GitHub_Actions_FreshResume',
            'resource_id':'$RESOURCE_ID',
            'resource_url':'https://github.com/$REPO/commit/$PROBE_COMMIT',
            'expected_nonce_sha256':'$A009_NONCE',
            'source_artifact_sha256':'$PARENT_A008_SHA256',
            'write':{
              'action':'fresh runner restored Gen8 successor, committed and pushed a new continuity probe',
              'resource_id':'$RESOURCE_ID',
              'canonical_observation_sha256':'$CANONICAL_OBS_SHA',
              'branch':'$BRANCH',
              'commit_sha':'$PROBE_COMMIT',
              'probe_file_sha256':'$PROBE_FILE_SHA'
            },
            'readbacks':[
              {
                'method':'git_remote_object_readback',
                'resource_id':'$RESOURCE_ID',
                'nonce_sha256':'$A009_NONCE',
                'canonical_observation_sha256':'$CANONICAL_OBS_SHA',
                'commit_sha':'$PROBE_COMMIT',
                'probe_file_sha256':'$GIT_PROBE_SHA'
              },
              {
                'method':'github_rest_contents_readback',
                'resource_id':'$RESOURCE_ID',
                'nonce_sha256':'$A009_NONCE',
                'canonical_observation_sha256':'$CANONICAL_OBS_SHA',
                'commit_sha':'$PROBE_COMMIT',
                'probe_file_sha256':'$REST_PROBE_SHA'
              }
            ],
            'claims':[
              {'name':'external.runtime.github_actions.fresh_successor_resume','value':1,'unit':'bool','direction':'true','durability':'external_service','objective_relevance':'direct'},
              {'name':'external.runtime.github_actions.cross_run_state_continuity','value':1,'unit':'bool','direction':'true','durability':'external_persistent','objective_relevance':'direct'},
              {'name':'external.runtime.github_actions.restored_parent_generation','value':8,'unit':'generation','direction':'higher','durability':'evidence_snapshot','objective_relevance':'direct'},
              {'name':'external.runtime.github_actions.fresh_resume_read_paths','value':2,'unit':'count','direction':'higher','durability':'external_persistent','objective_relevance':'direct'}
            ],
            'executable_spec':{
              'type':'orchestrated_connector',
              'provider':'GitHub_Actions_FreshResume',
              'actions':['load_remote_successor','restore_runtime_state','remote_git_commit','remote_git_push','git_remote_readback','github_rest_readback','self_ingest_external_receipt','construct_successor'],
              'authority':'github_actions_contents_write_isolated_branch',
              'repository_full_name':'$REPO',
              'branch_scope':'$BRANCH'
            },
            'claim_boundary':{
              'micgi_credit':0,
              'economic_credit':0,
              'meaning':'establishes one bounded fresh-run restoration and cross-generation transition from remote Gen8 state'
            }
          }
          raw=json.dumps(r,sort_keys=True,separators=(',',':')).encode()
          r['receipt_sha256']=hashlib.sha256(raw).hexdigest()
          open('/tmp/a009-runtime/external_receipts/github_actions_fresh_successor_resume.json','w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print('MICCGI_A009_RECEIPT_SHA256='+r['receipt_sha256'])
          PY

          cd "$SRC"
          PYTHONPATH="$SRC" python3 -m micgi --state-dir /tmp/a009-runtime cycle > /tmp/a009-cycle9.json
          PYTHONPATH="$SRC" python3 -m micgi --state-dir /tmp/a009-runtime status > /tmp/a009-status9.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/a009-status9.json'))
          assert s['generation']==9, s
          assert s['micgi']=='UNPROVEN'
          assert s['economic_t0']=='NOT_OBSERVED'
          assert s['verified_realized_profit']=='NOT_PROVEN'
          assert 'external.runtime.github_actions.fresh_successor_resume' in s['claims']
          assert s['claims']['external.runtime.github_actions.restored_parent_generation']['value']==8.0
          print('MICCGI_A009_FRESH_GEN8_TO_GEN9=PASS')
          PY

          set +e
          PYTHONPATH="$SRC" python3 -m micgi --state-dir /tmp/a009-runtime cycle > /tmp/a009-replay.json
          REPLAY_RC="$?"
          set -e
          test "$REPLAY_RC" = "2"
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/a009-replay.json'))
          assert r['admitted'] is False
          assert r['improvements']==[]
          PY

          cp /tmp/a009-status9.json "$SRC/A009_STATUS_AFTER.json"
          cat > "$SRC/FRESH_RESUME_ATTESTATION.json" <<EOF
          {
            "artifact": "MICCGI_REMOTE_SUCCESSOR_CAPSULE_A009",
            "parent_a008_artifact_sha256": "$PARENT_A008_SHA256",
            "fresh_runner_restored_generation": 8,
            "fresh_runner_admitted_generation": 9,
            "probe_commit_sha": "$PROBE_COMMIT",
            "probe_file_sha256": "$PROBE_FILE_SHA",
            "claim_boundary": {
              "micgi": "UNPROVEN",
              "economic_t0": "NOT_OBSERVED",
              "verified_realized_profit": "NOT_PROVEN"
            }
          }
          EOF

          cat > /tmp/a009-build.py <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,sys
          src=Path('/tmp/a009-capsule/MICCGI_REMOTE_SUCCESSOR_CAPSULE_A008')
          runtime=Path('/tmp/a009-runtime')
          out=Path(sys.argv[1])
          entries=[]
          selected=[src/'pyproject.toml',src/'tests/test_kernel.py',src/'A009_STATUS_AFTER.json',src/'FRESH_RESUME_ATTESTATION.json']+sorted((src/'micgi').rglob('*.py'))
          selected += [runtime/'current_state.json',runtime/'evidence.jsonl',runtime/'history.jsonl']
          selected += sorted((runtime/'external_receipts').glob('*.json'))
          for p in selected:
              if not p.exists():
                  continue
              try:
                  rel_runtime=p.relative_to(runtime)
                  rel='runtime_state/'+rel_runtime.as_posix()
              except ValueError:
                  rel=p.relative_to(src).as_posix()
              entries.append((rel,p.read_bytes()))
          manifest=[{'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()} for rel,data in entries]
          entries.append(('MANIFEST.json',(json.dumps({'artifact':'MICCGI_REMOTE_SUCCESSOR_CAPSULE_A009','files':manifest},sort_keys=True,indent=2)+'\n').encode()))
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in sorted(entries):
                  info=zipfile.ZipInfo('MICCGI_REMOTE_SUCCESSOR_CAPSULE_A009/'+rel,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o100644 & 0xffff)<<16
                  info.create_system=3
                  z.writestr(info,data,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          PY

          python3 /tmp/a009-build.py /tmp/A009_1.zip
          python3 /tmp/a009-build.py /tmp/A009_2.zip
          cmp /tmp/A009_1.zip /tmp/A009_2.zip
          FINAL_SHA="$(sha256sum /tmp/A009_1.zip | awk '{print $1}')"
          FINAL_BYTES="$(stat -c '%s' /tmp/A009_1.zip)"

          cd "$GITHUB_WORKSPACE"
          cp /tmp/A009_1.zip miccgi/a009-output/MICCGI_REMOTE_SUCCESSOR_CAPSULE_A009.zip
          cp /tmp/a009-status9.json miccgi/a009-output/A009_STATUS_AFTER.json
          cp "$SRC/FRESH_RESUME_ATTESTATION.json" miccgi/a009-output/FRESH_RESUME_ATTESTATION.json
          git add miccgi/a009-output/MICCGI_REMOTE_SUCCESSOR_CAPSULE_A009.zip miccgi/a009-output/A009_STATUS_AFTER.json miccgi/a009-output/FRESH_RESUME_ATTESTATION.json
          git commit -m "MICCGI A009 publish fresh-resumed Gen9 successor $FINAL_SHA"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          git push origin "HEAD:$BRANCH"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" --force
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$FINAL_COMMIT"

          echo "MICCGI_A009_PARENT_A008_SHA256=$PARENT_A008_SHA256"
          echo "MICCGI_A009_FRESH_RESTORED_GENERATION=8"
          echo "MICCGI_A009_REMOTE_GENERATION=9"
          echo "MICCGI_A009_FINAL_SUCCESSOR_SHA256=$FINAL_SHA"
          echo "MICCGI_A009_FINAL_SUCCESSOR_BYTES=$FINAL_BYTES"
          echo "MICCGI_A009_FINAL_COMMIT=$FINAL_COMMIT"
          echo "MICCGI_A009_REPLAY=REJECTED"
