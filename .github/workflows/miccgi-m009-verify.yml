name: MICCGI M009 commit-addressed verifier
on:
  push:
    branches:
      - miccgi-m009b-languagegenesis-fixed
    paths:
      - .github/workflows/miccgi-m009-verify.yml
      - miccgi_m009_verify.py
permissions:
  contents: write
jobs:
  verify-fixed-lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miccgi-m009b-languagegenesis-fixed
          fetch-depth: 0
      - name: Verify fixed lineage
        run: python3 miccgi_m009_verify.py
      - name: Commit adjudication
        run: |
          git config user.name "MICCGI M009 Verifier"
          git config user.email "miccgi-runtime@users.noreply.github.com"
          git add miccgi_m009_state/adjudication_commit_addressed.json
          git commit -m "MICCGI M009 commit-addressed adjudication" || exit 0
          git push origin HEAD
