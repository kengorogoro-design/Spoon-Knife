name: MICCGI M013 reality-grounded dynamical induction
on:
  push:
    branches:
      - miccgi-m013-reality-dynamics
    paths:
      - .github/workflows/miccgi-m013.yml
      - miccgi_m013_runtime.py
permissions:
  contents: write
jobs:
  reality-dynamics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miccgi-m013-reality-dynamics
          fetch-depth: 0
      - name: Run live World Bank dynamical induction
        run: python3 miccgi_m013_runtime.py
