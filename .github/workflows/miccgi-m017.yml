name: MICCGI M017 composite policy genesis
on:
  push:
    branches:
      - miccgi-m017-policy-composition
    paths:
      - .github/workflows/miccgi-m017.yml
      - miccgi_m017_runtime.py
permissions:
  contents: write
jobs:
  composite-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miccgi-m017-policy-composition
          fetch-depth: 0
      - name: Run cross-campaign composite policy genesis
        run: |
          python3 miccgi_m017_runtime.py
          git config user.name "MICCGI M017 Runtime"
          git config user.email "miccgi-runtime@users.noreply.github.com"
          git add miccgi_m017_state
          git commit -m "MICCGI M017 final adjudication" || true
          git push origin HEAD
