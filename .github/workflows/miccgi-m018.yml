name: MICCGI M018 environment-conditioned policy compilation
on:
  push:
    branches:
      - miccgi-m018-environment-conditioned-policy
    paths:
      - .github/workflows/miccgi-m018.yml
      - miccgi_m018_runtime.py
permissions:
  contents: write
jobs:
  env-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miccgi-m018-environment-conditioned-policy
          fetch-depth: 0
      - name: Run environment-conditioned policy compilation
        run: |
          python3 miccgi_m018_runtime.py
          git config user.name "MICCGI M018 Runtime"
          git config user.email "miccgi-runtime@users.noreply.github.com"
          git add miccgi_m018_state
          git commit -m "MICCGI M018 final adjudication" || true
          git push origin HEAD
