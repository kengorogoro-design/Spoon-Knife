name: MICCGI M019 nonstationarity-aware policy recompilation
on:
  push:
    branches:
      - miccgi-m019-nonstationary-policy
    paths:
      - .github/workflows/miccgi-m019.yml
      - miccgi_m019_runtime.py
permissions:
  contents: write
jobs:
  nonstationary-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: miccgi-m019-nonstationary-policy
          fetch-depth: 0
      - name: Run nonstationarity-aware policy recompilation
        run: |
          python3 miccgi_m019_runtime.py
          git config user.name "MICCGI M019 Runtime"
          git config user.email "miccgi-runtime@users.noreply.github.com"
          git add miccgi_m019_state
          git commit -m "MICCGI M019 final adjudication" || true
          git push origin HEAD
